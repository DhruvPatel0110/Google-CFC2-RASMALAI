<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Shield Base -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.4"/>
  
  <!-- Hospital Building Silhouette -->
  <path d="M30 92 V46 H90 V92 Z" fill="#0f172a" fill-opacity="0.55"/>
  <rect x="52" y="74" width="16" height="18" rx="3" fill="#38bdf8" fill-opacity="0.3"/>
  
  <!-- Healthcare Medical Cross with Glow -->
  <path d="M50 32 H70 V48 H86 V68 H70 V84 H50 V68 H34 V48 H50 Z" fill="url(#crossGrad)" filter="url(#glow)"/>
  
  <!-- Heartbeat / Resilience Pulse Line -->
  <path d="M22 60 H40 L46 48 L56 72 L64 54 L72 66 L78 60 H98" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
</svg>
